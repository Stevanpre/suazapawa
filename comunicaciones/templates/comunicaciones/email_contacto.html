<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f9; margin:0; padding:0; }
    .wrapper { max-width:600px; margin:30px auto; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,.1); }
    .header  { background:linear-gradient(135deg,#1e3a8a,#1d4ed8); padding:30px 24px; text-align:center; }
    .header h1 { color:#fff; margin:0; font-size:22px; }
    .header p  { color:rgba(255,255,255,.8); margin:6px 0 0; font-size:14px; }
    .body   { padding:28px 30px; }
    .badge  { display:inline-block; background:#dbeafe; color:#1e40af; font-size:11px; font-weight:700;
              text-transform:uppercase; letter-spacing:.06em; padding:3px 10px; border-radius:99px; margin-bottom:18px; }
    .row    { display:flex; gap:8px; margin-bottom:14px; align-items:flex-start; }
    .label  { min-width:110px; font-size:12px; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:.05em; padding-top:2px; }
    .value  { font-size:14px; color:#1e293b; flex:1; line-height:1.5; word-break:break-word; }
    .mensaje { background:#f8fafc; border-left:3px solid #3b82f6; padding:12px 16px; border-radius:0 8px 8px 0; font-size:14px; color:#334155; line-height:1.6; margin-top:6px; }
    .divider { border:none; border-top:1px solid #e2e8f0; margin:20px 0; }
    .footer { background:#f8fafc; padding:16px 24px; text-align:center; font-size:12px; color:#94a3b8; border-top:1px solid #e2e8f0; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>📬 Nuevo Mensaje de Contacto</h1>
      <p>Institución Educativa Suazapawa</p>
    </div>
    <div class="body">
      <span class="badge">Formulario de Contacto</span>

      <div class="row">
        <span class="label">Nombre</span>
        <span class="value"><strong>{{ nombre }}</strong></span>
      </div>
      <div class="row">
        <span class="label">Correo</span>
        <span class="value"><a href="mailto:{{ email }}" style="color:#2563eb;">{{ email }}</a></span>
      </div>
      <div class="row">
        <span class="label">Asunto</span>
        <span class="value">{{ asunto }}</span>
      </div>

      <hr class="divider">

      <div class="row" style="flex-direction:column;">
        <span class="label" style="margin-bottom:8px;">Mensaje</span>
        <div class="mensaje">{{ mensaje }}</div>
      </div>
    </div>
    <div class="footer">
      Este mensaje fue enviado desde el formulario de contacto del sitio web de Suazapawa.<br>
      Puedes responder directamente a <strong>{{ email }}</strong>
    </div>
  </div>
</body>
</html>
