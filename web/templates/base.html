{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Suazapawa | Plataforma Escolar{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ✅ TAILWIND CSS COMPILADO -->
  <link href="{% static 'css/tailwind.css' %}" rel="stylesheet">

  <!-- ✅ FLOWBITE CSS -->
  <link href="https://unpkg.com/flowbite@2.2.1/dist/flowbite.min.css" rel="stylesheet" />

  <!-- ✅ DAISYUI (ya lo cargas en tu Tailwind CLI, no es necesario inline si ya está incluido en `tailwind.config.js`) -->

  <!-- ✅ FONT AWESOME -->
  <script src="https://kit.fontawesome.com/xxx.js" crossorigin="anonymous"></script>

  <!-- ✅ AOS (Animate on Scroll) -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <!-- ✅ ESTILOS GLOBALES -->
  <link href="{% static 'css/global.css' %}" rel="stylesheet">

  <!-- ✅ CSS adicional por vista -->
  {% block extra_css %}{% endblock %}
</head>

<body class="text-gray-800 flex flex-col min-h-screen">

  <!-- ✅ NAVBAR separado -->
  {% include 'public/includes/navbar.html' %}

  <!-- ✅ CONTENIDO PRINCIPAL -->
  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <!-- ✅ FOOTER separado -->
  {% include 'public/includes/footer.html' %}

  <!-- ✅ AOS JS -->
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({
      once: true,
      duration: 800,
      easing: 'ease-in-out'
    });
  </script>
  <!-- ✅ Scripts adicionales por vista -->
  {% block extra_js %}{% endblock %}
</body>
</html>
