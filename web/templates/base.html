{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Suazapawa | Plataforma Escolar{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind CSS compilado -->
  <link href="{% static 'css/tailwind.css' %}" rel="stylesheet">

  <!-- Flowbite -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/3.1.2/flowbite.min.css" rel="stylesheet"> <!-- v3.1.2 :contentReference[oaicite:1]{index=1} -->

  <!-- AOS (Animate On Scroll) versión estable más reciente -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet"> <!-- v2.3.4 :contentReference[oaicite:2]{index=2} -->

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  {% block extra_css %}{% endblock %}
</head>
<body class="flex flex-col min-h-screen bg-sky-100 text-sky-900" data-theme="light">
  {% include 'public/includes/navbar.html' %}
  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>
  {% include 'public/includes/footer.html' %}

  <!-- Scripts al final del body -->

  <!-- Flowbite JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/3.1.2/flowbite.min.js"></script>

  <!-- AOS JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script>
    AOS.init({
      once: true,
      duration: 800,
      easing: 'ease-in-out'
    });
  </script>

  <!-- Vanilla-Tilt -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script> <!-- v1.8.1 :contentReference[oaicite:4]{index=4} -->


  {% block extra_js %}{% endblock %}
</body>
</html>
