{% load static %}
<div class="flex items-center space-x-3">
  {% if user.is_authenticated %}
    <a href="{% url 'dashboard' %}" class="inline-flex items-center px-2 py-2 bg-green-500 text-white rounded-full hover:bg-green-600">
      <i class="fas fa-compass mr-2"></i>Dashboard
    </a>

<form method="post" action="{% url 'logout' %}" class="inline">
  {% csrf_token %}
  <button type="submit" class="inline-flex items-center px-4 py-2 rounded-full hover:opacity-90" style="background-color: #000000; color: white;">
    <i class="fas fa-sign-out-alt mr-2"></i>Cerrar Sesión
  </button>
</form>


  {% else %}
    <a href="{% url 'login' %}" class="inline-flex items-center px-6 py-2 bg-green-500 text-black rounded-full ">
      <i class="fas fa-sign-in-alt mr-2"></i>Iniciar Sesión
    </a>
  {% endif %}
</div>
