{% load static %}

{% block content %}
<section id="galeria" class="py-20 bg-gradient-to-b from-blue-200 to-white">
  <!-- Título llamativo -->
 <h2 class="text-5xl font-extrabold text-center bg-clip-text text-red-500 mb-6" data-aos="fade-down" data-aos-duration="1000">
    🏫 Ambiente Escolar
  </h2>

  <!-- Galería con Grid responsivo -->
  <div class="max-w-7xl mx-auto px-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

    <!-- Imagen 1 -->
    <div class="rounded-xl overflow-hidden shadow-lg transform transition duration-300 hover:scale-105" data-aos="zoom-in-up" data-aos-delay="100">
      <img src="{% static 'img/zona escolar/colegio.JPG' %}" alt="Galería 1" class="w-full h-64 object-cover" />
    </div>

    <!-- Imagen 2 -->
    <div class="rounded-xl overflow-hidden shadow-lg transform transition duration-300 hover:scale-105" data-aos="zoom-in-up" data-aos-delay="200">
      <img src="{% static 'img/zona escolar/buses.JPG' %}" alt="Galería 2" class="w-full h-64 object-cover" />
    </div>

    <!-- Imagen 3 -->
    <div class="rounded-xl overflow-hidden shadow-lg transform transition duration-300 hover:scale-105" data-aos="zoom-in-up" data-aos-delay="300">
      <img src="{% static 'img/zona escolar/salones premiun.JPG' %}" alt="Galería 3" class="w-full h-64 object-cover" />
    </div>

    <!-- Imagen 4 -->
    <div class="rounded-xl overflow-hidden shadow-lg transform transition duration-300 hover:scale-105" data-aos="zoom-in-up" data-aos-delay="400">
      <img src="{% static 'img/zona escolar/niños.JPG' %}" alt="Galería 4" class="w-full h-64 object-cover" />
    </div>

    <!-- Imagen 5 -->
    <div class="rounded-xl overflow-hidden shadow-lg transform transition duration-300 hover:scale-105" data-aos="zoom-in-up" data-aos-delay="500">
      <img src="{% static 'img/zona escolar/canchas.JPG' %}" alt="Galería 5" class="w-full h-64 object-cover" />
    </div>

    <!-- Imagen 6 -->
    <div class="rounded-xl overflow-hidden shadow-lg transform transition duration-300 hover:scale-105" data-aos="zoom-in-up" data-aos-delay="600">
      <img src="{% static 'img/zona escolar/salones.JPG' %}" alt="Galería 6" class="w-full h-64 object-cover" />
    </div>

  </div>
</section>
{% endblock %}
