{% load static %}
<!-- GALERÍA AOS -->
<section id="galeria" class="py-20 bg-gradient-to-b from-blue-200 to-white">
  <!-- Título llamativo -->
  <h2 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-blue-500 mb-12 text-center" data-aos="fade-down" data-aos-duration="1000">
    Galería Suazapawa
  </h2>

  <!-- Rejilla tipo Masonry -->
  <div class="max-w-7xl mx-auto px-4 columns-1 sm:columns-2 lg:columns-3 gap-4 space-y-4">

    <!-- Imagen 1 -->
    <div class="break-inside-avoid rounded-xl overflow-hidden shadow-xl" data-aos="zoom-in-up" data-aos-delay="100">
      <img src="{% static 'img/galeria/gale1.webp' %}" alt="Galería 1" class="w-full h-auto transition-transform hover:scale-105 duration-300">
    </div>

    <!-- Imagen 2 -->
    <div class="break-inside-avoid rounded-xl overflow-hidden shadow-xl" data-aos="zoom-in-up" data-aos-delay="200">
      <img src="{% static 'img/galeria/gale2.webp' %}" alt="Galería 2" class="w-full h-auto transition-transform hover:scale-105 duration-300">
    </div>

    <!-- Imagen 3 -->
    <div class="break-inside-avoid rounded-xl overflow-hidden shadow-xl" data-aos="zoom-in-up" data-aos-delay="300">
      <img src="{% static 'img/galeria/gale3.webp' %}" alt="Galería 3" class="w-full h-auto transition-transform hover:scale-105 duration-300">
    </div>

    <!-- Imagen 4 -->
    <div class="break-inside-avoid rounded-xl overflow-hidden shadow-xl" data-aos="zoom-in-up" data-aos-delay="400">
      <img src="{% static 'img/galeria/gale4.webp' %}" alt="Galería 4" class="w-full h-auto transition-transform hover:scale-105 duration-300">
    </div>

    <!-- Imagen 5 -->
    <div class="break-inside-avoid rounded-xl overflow-hidden shadow-xl" data-aos="zoom-in-up" data-aos-delay="500">
      <img src="{% static 'img/galeria/gale5.webp' %}" alt="Galería 5" class="w-full h-auto transition-transform hover:scale-105 duration-300">
    </div>

    <!-- Imagen 6 -->
    <div class="break-inside-avoid rounded-xl overflow-hidden shadow-xl" data-aos="zoom-in-up" data-aos-delay="600">
      <img src="{% static 'img/galeria/gale6.webp' %}" alt="Galería 6" class="w-full h-auto transition-transform hover:scale-105 duration-300">
    </div>

  </div>
</section>
