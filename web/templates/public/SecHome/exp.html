{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Suazapawa | Experiencia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- AOS Animations -->
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    @keyframes pulse-slow {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }

    .animate-float { animation: float 6s ease-in-out infinite; }
    .animate-pulse-slow { animation: pulse-slow 8s ease-in-out infinite; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-indigo-900 to-sky-900 text-white">

<!-- EXPERIENCIA SECTION -->
<section class="py-24 relative overflow-hidden" id="experiencia">
  <!-- Decoración -->
  <div class="absolute inset-0 opacity-10 pointer-events-none z-0">
    <div class="absolute top-10 left-10 w-40 h-40 bg-cyan-400 rounded-full animate-float blur-2xl"></div>
    <div class="absolute bottom-20 right-20 w-32 h-32 bg-indigo-300 rounded-full animate-pulse blur-2xl"></div>
  </div>

  <div class="container mx-auto px-6 lg:px-16 relative z-10">
    <!-- Título con fondo suave -->
    <div class="text-center mb-20 px-6 py-10 bg-sky-800/30 backdrop-blur-md rounded-xl shadow-lg" data-aos="fade-up">
      <h2 class="text-5xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-300 via-sky-400 to-indigo-400 bg-clip-text text-transparent drop-shadow-md">
        35 Años de Excelencia Académica
      </h2>
      <p class="text-lg mt-4 text-white max-w-2xl mx-auto leading-relaxed">
        Tres décadas y media construyendo un legado educativo con propósito, pasión y proyección internacional.
      </p>
    </div>

    <!-- Tarjetas estadísticas -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 mb-20">
      <div class="text-center p-6 bg-cyan-900/60 backdrop-blur-md rounded-2xl shadow-xl" data-aos="zoom-in" data-aos-delay="100">
        <i class="fas fa-award text-cyan-300 text-5xl mb-4"></i>
        <div class="text-4xl font-bold text-white">35+</div>
        <p class="text-white/80 mt-2">Años de Trayectoria</p>
      </div>
      <div class="text-center p-6 bg-indigo-900/60 backdrop-blur-md rounded-2xl shadow-xl" data-aos="zoom-in" data-aos-delay="200">
        <i class="fas fa-user-graduate text-indigo-300 text-5xl mb-4"></i>
        <div class="text-4xl font-bold text-white">1500+</div>
        <p class="text-white/80 mt-2">Estudiantes Graduados</p>
      </div>
      <div class="text-center p-6 bg-pink-800/60 backdrop-blur-md rounded-2xl shadow-xl" data-aos="zoom-in" data-aos-delay="300">
        <i class="fas fa-heart text-pink-300 text-5xl mb-4"></i>
        <div class="text-4xl font-bold text-white">99%</div>
        <p class="text-white/80 mt-2">Satisfacción Familiar</p>
      </div>
      <div class="text-center p-6 bg-yellow-700/60 backdrop-blur-md rounded-2xl shadow-xl" data-aos="zoom-in" data-aos-delay="400">
        <i class="fas fa-university text-yellow-300 text-5xl mb-4"></i>
        <div class="text-4xl font-bold text-white">+95%</div>
        <p class="text-white/80 mt-2">Ingreso a la Universidad</p>
      </div>
    </div>

    <!-- Imagen institucional -->
    <div class="relative max-w-6xl mx-auto rounded-3xl overflow-hidden shadow-2xl border-4 border-white/10 group" data-aos="fade-up" data-aos-delay="500">
      <img src="{% static 'img/experiencia.jpg' %}" alt="Colegio Suazapawa - 35 años"
           class="w-full h-auto object-cover object-center transition-transform duration-700 ease-in-out group-hover:scale-105">
      <div class="absolute inset-0 bg-gradient-to-tr from-black/40 to-transparent group-hover:backdrop-blur-sm transition-all duration-700 z-10"></div>
    </div>
  </div>
</section>

<!-- AOS JS -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init({
    duration: 1000,
    once: true,
    easing: 'ease-in-out',
  });
</script>
</body>
</html>
