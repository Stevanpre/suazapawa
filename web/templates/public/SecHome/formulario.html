{% load static %}
<section class="min-h-screen bg-blue-50 flex items-center justify-center px-6 py-10">
  <div class="flex flex-col lg:flex-row w-full max-w-7xl bg-white shadow-2xl rounded-3xl overflow-hidden">



    <!-- Formulario -->
<div class="w-full lg:w-1/2 p-10 bg-gradient-to-l from-sky-100 via-blue-100 to-sky-200 flex flex-col justify-center min-h-[720px]">

       <div class="text-center mb-10" data-aos="zoom-in" data-aos-duration="800">
  <!-- Icono decorativo superior -->
  <div class="flex justify-center mb-3">
    <i class="fas fa-user-edit text-pink-500 text-4xl drop-shadow-md"></i>
  </div>

  <!-- Título principal -->
  <h2 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-blue-500">
    Formulario de Registro
  </h2>
</div>

      <form class="space-y-6 w-full">
        <div>
          <label class="text-violet-700 font-semibold flex items-center gap-2">
            <i class="fas fa-user"></i> Nombre del Estudiante
          </label>
          <input type="text" placeholder="Juan Pérez"
            class="w-full border border-violet-300 rounded-xl px-4 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-violet-400" />
        </div>

        <div>
          <label class="text-violet-700 font-semibold flex items-center gap-2">
            <i class="fas fa-envelope"></i> Correo Electrónico
          </label>
          <input type="email" placeholder="correo@ejemplo.com"
            class="w-full border border-violet-300 rounded-xl px-4 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-violet-400" />
        </div>

        <div>
          <label class="text-violet-700 font-semibold flex items-center gap-2">
            <i class="fas fa-phone"></i> Teléfono
          </label>
          <input type="tel" placeholder="310 123 4567"
            class="w-full border border-violet-300 rounded-xl px-4 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-violet-400" />
        </div>

        <div>
          <label class="text-violet-700 font-semibold flex items-center gap-2">
            <i class="fas fa-school"></i> Grado
          </label>
          <select class="w-full border border-violet-300 rounded-xl px-4 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-violet-400">
            <option>Selecciona un grado</option>
            <option>Prejardín</option>
            <option>Jardín</option>
            <option>Transición</option>
            <option>Primero</option>
          </select>
        </div>

        <div>
          <button type="submit"
            class="w-full py-3 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold rounded-xl shadow-lg hover:from-purple-600 hover:to-pink-600 transition-all duration-300">
            <i class="fas fa-paper-plane mr-2"></i> Enviar Solicitud
          </button>
        </div>
      </form>
    </div>

    <!-- Imagen -->
    <div class="w-full lg:w-1/2 min-h-[720px]">
      <img src="{% static 'img/formulario.jpg' %}" alt="Proceso de Admisión"
        class="object-cover w-full h-full" />
    </div>

  </div>
</section>
