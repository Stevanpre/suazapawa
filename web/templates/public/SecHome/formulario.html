<!-- FORMULARIO DE INSCRIPCIÓN -->
{% load static %}
<section class="py-20 text-gray-800">
  <div class="container mx-auto px-4">
    <!-- Encabezado -->
    <div class="text-center mb-16" data-taos-offset="200" data-taos="fade-up">
      <i class="fas fa-user-plus text-5xl text-indigo-500 mb-4"data-aos="fade-down" data-aos-duration="1000"></i>
        <h2 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-blue-500 mb-12 text-center" data-aos="fade-down" data-aos-duration="1000">
Formulario de Inscripción</h2>

      <p class="text-lg text-gray-600 max-w-2xl mx-auto">¡Únete a la familia Suazapawa y haz parte de una educación con propósito!</p>
    </div>

    <!-- Contenido -->
    <div class="flex flex-col lg:flex-row gap-12 items-start">

      <!-- Formulario -->
      <div class="w-full lg:w-1/2 bg-white rounded-3xl shadow-xl p-8" data-taos-offset="200" data-taos-delay="100" data-taos="slide-right">
        <div class="space-y-6">
          <!-- Campo Nombre -->
          <div>
            <label class="block text-sm font-semibold mb-1 text-indigo-700">
              <i class="fas fa-user mr-2"></i>Nombre del Estudiante
            </label>
            <input type="text" placeholder="Juan Pérez"
              class="w-full px-5 py-3 rounded-lg border border-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-gray-800 transition duration-300">
          </div>

          <!-- Campo Correo -->
          <div>
            <label class="block text-sm font-semibold mb-1 text-indigo-700">
              <i class="fas fa-envelope mr-2"></i>Correo Electrónico
            </label>
            <input type="email" placeholder="correo@ejemplo.com"
              class="w-full px-5 py-3 rounded-lg border border-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-gray-800 transition duration-300">
          </div>

          <!-- Campo Teléfono -->
          <div>
            <label class="block text-sm font-semibold mb-1 text-indigo-700">
              <i class="fas fa-phone mr-2"></i>Teléfono
            </label>
            <input type="tel" placeholder="310 123 4567"
              class="w-full px-5 py-3 rounded-lg border border-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-gray-800 transition duration-300">
          </div>

          <!-- Campo Grado -->
          <div>
            <label class="block text-sm font-semibold mb-1 text-indigo-700">
              <i class="fas fa-school mr-2"></i>Grado
            </label>
            <select
              class="w-full px-5 py-3 rounded-lg border border-indigo-300 bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition duration-300">
              <option disabled selected>Selecciona un grado</option>
              <option value="preescolar">Preescolar</option>
              <option value="primaria">Primaria</option>
              <option value="secundaria">Secundaria</option>
              <option value="media">Media Técnica</option>
            </select>
          </div>

          <!-- Botón Enviar -->
          <button
            class="w-full mt-4 bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-400 hover:to-purple-400 text-white font-bold py-3 rounded-lg shadow-lg transition-all duration-300">
            Enviar Solicitud
          </button>
        </div>
      </div>

      <!-- Lado derecho: imagen + pasos -->
      <div class="w-full lg:w-1/2" data-taos-offset="200" data-taos-delay="200" data-taos="slide-left">
        <!-- Imagen representativa -->
        <div class="rounded-3xl overflow-hidden shadow-md mb-8">
          <img src="{% static 'img/logo-suazapawa.jpg' %}" alt="Proceso de inscripción" class="w-full object-cover h-64">
        </div>

        <!-- Pasos -->
        <div class="space-y-6">
          <h3 class="text-2xl font-bold text-indigo-700">Proceso de Admisión</h3>
          <ul class="space-y-4 text-gray-700">
            <li class="flex items-center gap-3">
              <span class="w-8 h-8 bg-indigo-200 text-indigo-700 font-bold rounded-full flex items-center justify-center">1</span>
              <span>Completa el formulario</span>
            </li>
            <li class="flex items-center gap-3">
              <span class="w-8 h-8 bg-indigo-200 text-indigo-700 font-bold rounded-full flex items-center justify-center">2</span>
              <span>Entrevista académica</span>
            </li>
            <li class="flex items-center gap-3">
              <span class="w-8 h-8 bg-indigo-200 text-indigo-700 font-bold rounded-full flex items-center justify-center">3</span>
              <span>Evaluación diagnóstica</span>
            </li>
            <li class="flex items-center gap-3">
              <span class="w-8 h-8 bg-indigo-200 text-indigo-700 font-bold rounded-full flex items-center justify-center">4</span>
              <span>Confirmación de cupo</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
