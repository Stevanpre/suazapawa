{% load static %}

{% block extra_css %}
<style>
  .fade-in-start {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 2s ease-out, transform 2s ease-out;
    will-change: opacity, transform;
  }

  .fade-in-active {
    opacity: 1;
    transform: translateY(0);
  }

  .carousel-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .carousel-bg img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    opacity: 0;
    transition: opacity 2s ease-in-out;
  }

  .carousel-bg img.active {
    opacity: 1;
    z-index: 1;
  }

  .bg-overlay {
    position: absolute;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.4);
    mix-blend-mode: multiply;
    z-index: 2;
  }

  .glass-panel {
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 1rem;
    padding: 2rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    color: #1e293b;
  }

  .glass-panel h2 {
    color: #1e3a8a;
  }

  .glass-panel p {
    color: #1f2937;
  }

  .highlighted-title {
    background: linear-gradient(to right, #1e3a8a, #4f46e5, #0ea5e9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }
</style>
{% endblock %}

{% block content %}
<section id="hero-section" class="relative min-h-screen fade-in-start overflow-hidden flex items-center justify-center">

  <!-- Imagen de fondo tipo carrusel -->
  <div class="carousel-bg">
    <img src="{% static 'img/somos.JPG' %}" class="active" alt="Fondo 1">
    <img src="{% static 'img/fondo2Ex.JPG' %}" alt="Fondo 2">
    <img src="{% static 'img/fondo3Ex.JPG' %}" alt="Fondo 3">
    <div class="bg-overlay"></div>
  </div>

  <!-- Contenido sobre la imagen de fondo -->
  <div class="relative z-10 w-full max-w-6xl mx-auto px-6 py-16 lg:py-32">
    <div class="glass-panel max-w-3xl lg:max-w-2xl space-y-8 text-center lg:text-left">
      <h2 class="text-lg font-semibold tracking-wide">¡Bienvenido a nuestra comunidad!</h2>
      <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold leading-tight tracking-tight">
        <span class="block text-gray-800">Institución Educativa</span>
        <span class="block text-6xl sm:text-7xl lg:text-8xl highlighted-title">Suazapawa</span>
      </h1>
      <p class="text-lg text-gray-800">Formamos líderes con valores, excelencia académica y compromiso social.</p>

      <!-- Botones -->
      <div class="flex flex-wrap gap-4 justify-center lg:justify-start pt-2">
        <a href="#conocenos"
           class="px-6 py-3 rounded-full text-white font-medium bg-indigo-600 hover:bg-indigo-700 transition duration-300 shadow-lg hover:scale-105">
          Conócenos
        </a>
        <a href="{% url 'admision' %}"
           class="px-6 py-3 rounded-full text-indigo-800 font-semibold bg-white/80 backdrop-blur-md border border-white/30 hover:bg-white hover:scale-105 transition duration-500 shadow-lg">
          <i class="fas fa-arrow-right mr-2"></i> Proceso de Admisión
        </a>
      </div>
    </div>
  </div>

</section>
{% endblock %}

{% block extra_js %}
<script>
  // Fade-in
  window.addEventListener("DOMContentLoaded", () => {
    const hero = document.getElementById("hero-section");
    setTimeout(() => {
      hero.classList.add("fade-in-active");
    }, 800);
  });

  // Carrusel automático
  const images = document.querySelectorAll(".carousel-bg img");
  let index = 0;

  setInterval(() => {
    images[index].classList.remove("active");
    index = (index + 1) % images.length;
    images[index].classList.add("active");
  }, 7000);
</script>
{% endblock %}
