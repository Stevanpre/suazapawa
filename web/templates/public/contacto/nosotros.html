{% extends 'base.html' %}
{% load static %}

{% block title %}📞 Contáctanos | Suazapawa{% endblock %}


{% block content %}
<section class="bg-gradient-to-b from-sky-50 to-cyan-100 py-16">
  <div class="max-w-7xl mx-auto px-6" data-aos="fade-up" data-aos-duration="1000">

    <!-- Título -->
    <h2 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-blue-500 text-center mb-12">
      📬 Contáctanos
    </h2>

    <!-- Contenedor -->
    <div class="grid md:grid-cols-2 gap-10 items-start">

      <!-- Info + mapa -->
      <div class="space-y-6" data-aos="fade-right" data-aos-delay="200">
        <div class="bg-white p-6 rounded-3xl shadow-xl border border-blue-100 space-y-4">
          <div class="flex items-start gap-4">
            <i class="fa-solid fa-phone text-2xl text-sky-600"></i>
            <div>
              <h3 class="font-semibold text-sky-800">Teléfono</h3>
              <p class="text-gray-600">(+57) 313 4188407</p>
            </div>
          </div>
          <div class="flex items-start gap-4">
            <i class="fa-solid fa-envelope text-2xl text-sky-600"></i>
            <div>
              <h3 class="font-semibold text-sky-800">Correo</h3>
              <p class="text-gray-600">suazapawa@yahoo.com</p>
            </div>
          </div>
          <div class="flex items-start gap-4">
            <i class="fa-solid fa-location-dot text-2xl text-sky-600"></i>
            <div>
              <h3 class="font-semibold text-sky-800">Ubicación</h3>
              <p class="text-gray-600">Vía Duitama-Nobsa Km 13, Boyacá</p>
            </div>
          </div>
        </div>

        <!-- Mapa -->
        <div class="rounded-xl overflow-hidden shadow-lg border border-blue-100">
          <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3977.0911527249927!2d-72.96889968467725!3d5.757726893060829!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e6a46e6e07c5b91%3A0x383451ef2186e5cc!2sCentro%20Educativo%20Suazapawa!5e0!3m2!1ses-419!2sco!4v1720318800000!5m2!1ses-419!2sco" width="100%" height="250" frameborder="0" allowfullscreen loading="lazy" class="rounded-xl w-full h-64"></iframe>
        </div>
      </div>

      <!-- Formulario -->
      <form method="POST" class="bg-white p-8 rounded-3xl shadow-2xl border border-blue-100 space-y-6" data-aos="fade-left" data-aos-delay="300">
        {% csrf_token %}
        <div>
          <label class="block mb-1 text-sm font-medium text-sky-800">Nombre completo *</label>
          <input type="text" name="nombre" required placeholder="Ej: Ana Martínez" class="input input-bordered w-full focus:ring-2 focus:ring-pink-400" />
        </div>

        <div>
          <label class="block mb-1 text-sm font-medium text-sky-800">Correo electrónico *</label>
          <input type="email" name="email" required placeholder="Ej: ana@email.com" class="input input-bordered w-full focus:ring-2 focus:ring-pink-400" />
        </div>

        <div>
          <label class="block mb-1 text-sm font-medium text-sky-800">Asunto *</label>
          <input type="text" name="asunto" required placeholder="Ej: Información sobre inscripciones" class="input input-bordered w-full focus:ring-2 focus:ring-pink-400" />
        </div>

        <div>
          <label class="block mb-1 text-sm font-medium text-sky-800">Mensaje *</label>
          <textarea name="mensaje" rows="5" required placeholder="Escribe tu mensaje aquí..." class="textarea textarea-bordered w-full focus:ring-2 focus:ring-pink-400"></textarea>
        </div>

        <div class="text-center">
          <button type="submit" class="btn bg-gradient-to-r from-pink-500 to-blue-500 text-white px-10 py-3 rounded-xl hover:scale-105 transition">
            📨 Enviar mensaje
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
