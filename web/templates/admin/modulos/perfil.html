<div class="perfil-card p-4 mb-4">
  <div class="d-flex align-items-center mb-4">
    <div class="perfil-avatar me-4">
      <i class="fas fa-user-cog"></i>
    </div>
    <h4 class="fw-semibold mb-0 text-primary">
      Configuración de Perfil
    </h4>
  </div>

  <form method="post" action="{% url 'actualizar_perfil' %}">
    {% csrf_token %}

    <!-- NOMBRE -->
    <div class="mb-4">
      <label for="first_name" class="form-label fw-semibold">Nombre</label>
      <input type="text" class="form-control perfil-input" name="first_name" id="first_name" value="{{ request.user.first_name }}">
    </div>

    <!-- USUARIO -->
    <div class="mb-4">
      <label for="username" class="form-label fw-semibold">Nombre de usuario</label>
      <input type="text" class="form-control perfil-input" name="username" id="username" value="{{ request.user.username }}">
    </div>

    <!-- CORREO -->
    <div class="mb-4">
      <label for="email" class="form-label fw-semibold">Correo de recuperación</label>
      <input type="email" class="form-control perfil-input" name="email" id="email" value="{{ request.user.email }}">
    </div>

    <!-- CAMBIO DE CONTRASEÑA -->
    <div class="mb-4">
      <label class="form-label fw-semibold">Cambiar contraseña</label>
      <input type="password" class="form-control perfil-input mb-2" name="password1" placeholder="Nueva contraseña">
      <input type="password" class="form-control perfil-input" name="password2" placeholder="Confirmar contraseña">
    </div>

    <button type="submit" class="btn btn-success perfil-btn-guardar">
      <i class="fas fa-save me-2"></i> Guardar cambios
    </button>
  </form>
</div>

<style>
.perfil-card {
  background: linear-gradient(120deg, #e0f7fa 60%, #fafdff 100%);
  border-radius: 1.1rem;
  box-shadow: 0 2px 12px rgba(120,200,220,0.10);
  border: 1px solid #d0f4fd;
  max-width: 480px;
  margin: 0 auto;
  animation: fadeInPerfil 0.7s;
}
@keyframes fadeInPerfil {
  from { opacity: 0; transform: translateY(30px);}
  to { opacity: 1; transform: translateY(0);}
}
.perfil-avatar {
  width: 54px;
  height: 54px;
  background: linear-gradient(135deg, #b6eaff 60%, #e0f7fa 100%);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  color: #2b8ca7;
  box-shadow: 0 1px 6px rgba(120,200,220,0.12);
}
.perfil-input {
  border-radius: 0.7rem;
  border: 1.5px solid #d0f4fd;
  background: #fafdff;
  transition: border-color 0.2s, box-shadow 0.2s;
  font-size: 1.08rem;
  padding: 0.7rem 1rem;
}
.perfil-input:focus {
  border-color: #2b8ca7;
  box-shadow: 0 0 0 2px #b6eaff33;
}
.perfil-btn-guardar {
  padding: 0.7rem 1.5rem;
  font-size: 1.1rem;
  border-radius: 0.7rem;
  box-shadow: 0 2px 8px rgba(120,200,220,0.10);
  transition: background 0.18s, transform 0.18s;
}
.perfil-btn-guardar:hover {
  background: #2b8ca7;
  color: #fff;
  transform: translateY(-2px) scale(1.03);
}
</style>
