<div class="bg-gradient-to-br from-cyan-100 via-white to-cyan-50 border border-cyan-200 rounded-2xl shadow-lg max-w-md mx-auto p-6 animate-fade-in" data-aos="fade-up">
  <div class="flex items-center gap-4 mb-6">
    <div class="w-14 h-14 bg-gradient-to-tr from-cyan-300 to-cyan-100 rounded-full flex items-center justify-center text-3xl text-cyan-800 shadow">
      <i class="fas fa-user-cog"></i>
    </div>
    <h4 class="text-xl font-semibold text-sky-700 mb-0">Configuración de Perfil</h4>
  </div>

  <form method="post" action="{% url 'actualizar_perfil' %}" class="space-y-5">
    {% csrf_token %}

    <!-- NOMBRE -->
    <div>
      <label for="first_name" class="block font-semibold mb-1 text-sky-800">Nombre</label>
      <input type="text" name="first_name" id="first_name" value="{{ request.user.first_name }}"
        class="w-full rounded-xl border border-cyan-200 bg-white px-4 py-2.5 text-base text-sky-900 shadow-sm focus:border-sky-400 focus:ring-2 focus:ring-sky-200 transition" />
    </div>

    <!-- USUARIO -->
    <div>
      <label for="username" class="block font-semibold mb-1 text-sky-800">Nombre de usuario</label>
      <input type="text" name="username" id="username" value="{{ request.user.username }}"
        class="w-full rounded-xl border border-cyan-200 bg-white px-4 py-2.5 text-base text-sky-900 shadow-sm focus:border-sky-400 focus:ring-2 focus:ring-sky-200 transition" />
    </div>

    <!-- CORREO -->
    <div>
      <label for="email" class="block font-semibold mb-1 text-sky-800">Correo de recuperación</label>
      <input type="email" name="email" id="email" value="{{ request.user.email }}"
        class="w-full rounded-xl border border-cyan-200 bg-white px-4 py-2.5 text-base text-sky-900 shadow-sm focus:border-sky-400 focus:ring-2 focus:ring-sky-200 transition" />
    </div>

    <!-- CAMBIO DE CONTRASEÑA -->
    <div>
      <label class="block font-semibold mb-1 text-sky-800">Cambiar contraseña</label>
      <input type="password" name="password1" placeholder="Nueva contraseña"
        class="w-full rounded-xl border border-cyan-200 bg-white px-4 py-2.5 mb-2 text-base text-sky-900 shadow-sm focus:border-sky-400 focus:ring-2 focus:ring-sky-200 transition" />
      <input type="password" name="password2" placeholder="Confirmar contraseña"
        class="w-full rounded-xl border border-cyan-200 bg-white px-4 py-2.5 text-base text-sky-900 shadow-sm focus:border-sky-400 focus:ring-2 focus:ring-sky-200 transition" />
    </div>

    <button type="submit"
      class="mt-2 w-full bg-emerald-500 hover:bg-sky-600 text-white text-lg font-semibold py-2.5 rounded-xl transition-transform hover:scale-105 shadow-md">
      <i class="fas fa-save mr-2"></i> Guardar cambios
    </button>
  </form>
</div>
